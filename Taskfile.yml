version: "3"

vars:

tasks:
  default:
    cmds:
      - task --list

  init:
    desc: Initialize environment (create dirs, secrets)
    cmds:
      - bash scripts/init.sh

  # Task 在所有平台 (含 Windows) 都以內建的 sh 直譯器執行 cmds，
  # 因此只保留一份 POSIX sh 寫法，不另寫 PowerShell 分支。
  up:
    desc: Start all services (or specific SERVICE)
    vars:
      SERVICE: '{{.SERVICE | default .S | default ""}}'
    cmds:
      - |
        if [ -n "{{.SERVICE}}" ]; then
          echo "[INFO] Starting service: {{.SERVICE}}..."
          docker compose up -d {{.SERVICE}}
        else
          echo "[INFO] Starting all services..."
          docker compose up -d
        fi

  down:
    desc: Stop all services (or specific SERVICE)
    vars:
      SERVICE: '{{.SERVICE | default .S | default ""}}'
    cmds:
      - |
        if [ -n "{{.SERVICE}}" ]; then
          echo "[INFO] Stopping service: {{.SERVICE}}..."
          docker compose stop {{.SERVICE}}
        else
          echo "[INFO] Stopping all services..."
          docker compose down
        fi

  restart:
    desc: Restart all services (or specific SERVICE)
    vars:
      SERVICE: '{{.SERVICE | default .S | default ""}}'
    cmds:
      - |
        if [ -n "{{.SERVICE}}" ]; then
          echo "[INFO] Restarting service: {{.SERVICE}}..."
          docker compose restart {{.SERVICE}}
        else
          echo "[INFO] Restarting all services..."
          task down
          task up
        fi

  ps:
    desc: View service status (or specific SERVICE)
    vars:
      SERVICE: '{{.SERVICE | default .S | default ""}}'
    cmds:
      - |
        if [ -n "{{.SERVICE}}" ]; then
          echo "[INFO] Checking service health: {{.SERVICE}}..."
          docker compose ps {{.SERVICE}}
        else
          echo "[INFO] Checking service health..."
          docker compose ps
        fi
      - echo ""
      - cmd: echo "[INFO] Uptime Kuma http://localhost:3001"

  ps-all:
    desc: View all containers, including stopped and one-shot ones
    cmds:
      - docker compose ps -a

  stats:
    desc: Show current CPU and memory usage of this project's containers
    cmds:
      - docker compose stats --no-stream

  validate:
    desc: Validate the resolved Compose configuration
    preconditions:
      - sh: test -f .env
        msg: ".env not found. Run 'task init' first."
    cmds:
      - docker compose config --quiet
      - echo "[OK] Compose configuration is valid."

  # ------------------------------------------
  # 按需啟停：群組與組合定義在 scripts/lab.sh
  # ------------------------------------------
  lab:list:
    desc: List service groups and modes
    cmds:
      - bash scripts/lab.sh list

  lab:up:
    desc: Start service groups (additive), e.g. task lab:up G="sql cache"
    requires:
      vars: [G]
    cmds:
      - bash scripts/lab.sh up {{.G}}

  lab:api:
    desc: "Start mode api (additive): SQL Server, Redis, RabbitMQ, Mailpit"
    cmds:
      - bash scripts/lab.sh mode-up api

  lab:api-full:
    desc: "Start mode api-full (additive): api + Keycloak, Seq"
    cmds:
      - bash scripts/lab.sh mode-up api-full

  lab:search:
    desc: "Start mode search (additive): Elasticsearch, Kibana"
    cmds:
      - bash scripts/lab.sh mode-up search

  lab:cache:
    desc: "Start mode cache (additive): Redis, RedisInsight, Redis Exporter"
    cmds:
      - bash scripts/lab.sh mode-up cache

  lab:monitor:
    desc: "Start mode monitor (additive): Seq, Uptime Kuma, Dozzle"
    cmds:
      - bash scripts/lab.sh mode-up monitor

  lab:switch:
    desc: Stop services outside MODE, then start MODE, e.g. task lab:switch MODE=api
    requires:
      vars: [MODE]
    cmds:
      - bash scripts/lab.sh switch {{.MODE}}

  lab:stop:
    desc: Stop all running services (keep containers and data)
    cmds:
      - docker compose stop

  lab:mem:
    desc: Show memory limits of groups or a mode, e.g. task lab:mem G="sql cache" / MODE=api
    vars:
      G: '{{.G | default ""}}'
      MODE: '{{.MODE | default ""}}'
    cmds:
      - |
        if [ -n "{{.MODE}}" ]; then
          bash scripts/lab.sh mem-mode {{.MODE}}
        else
          bash scripts/lab.sh mem {{.G}}
        fi

  lab:verify:
    desc: Validate configuration and show runtime status and resource usage
    cmds:
      - task: validate
      - task: doctor
      - task: ps-all
      - task: stats

  compose-logs:
    desc: View Docker compose logs (or specific SERVICE)
    vars:
      SERVICE: '{{.SERVICE | default .S | default ""}}'
    cmds:
      - |
        if [ -n "{{.SERVICE}}" ]; then
          docker compose logs -f {{.SERVICE}}
        else
          echo "[INFO] Dozzle Log Viewer: http://localhost:8280"
          docker compose logs -f
        fi

  backup:
    desc: Run full backup (SQL/Redis Dump + Volume Tarball)
    cmds:
      - bash scripts/backup.sh

  clean-script-logs:
    desc: Clean script logs (all, or older than DAYS)
    vars:
      DAYS: '{{.DAYS | default .D | default ""}}'
    cmds:
      - |
        if [ -n "{{.DAYS}}" ]; then
          bash scripts/cleanup.sh logs {{.DAYS}}
        else
          bash scripts/cleanup.sh logs
        fi

  clean:
    desc: Remove containers and networks (Keep data)
    cmds:
      - bash scripts/cleanup.sh containers

  purge:
    desc: Remove EVERYTHING (containers, networks, data)
    prompt: "Are you sure you want to DESTROY all data?"
    cmds:
      - bash scripts/cleanup.sh purge

  doctor:
    desc: Validate environment, compose paths, and permissions
    cmds:
      - bash scripts/doctor.sh

  doctor-fix:
    desc: Validate and auto-fix writable permission issues
    cmds:
      - bash scripts/doctor.sh --fix

  smoke:
    desc: Run end-to-end smoke test (init/up/ps/backup/down/doctor-fix/doctor)
    cmds:
      - task: init
      - task: up
      - task: ps
      - task: backup
      - task: down
      - task: doctor-fix
      - task: doctor
