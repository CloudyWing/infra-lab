services:
  mosquitto:
    image: eclipse-mosquitto:${MOSQUITTO_TAG}
    container_name: mosquitto
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    extends:
      file: ../../policies/base.yml
      service: default-policy
    networks:
      - shared_net
    ports:
      - "${MOSQUITTO_PORT}:1883"
      - "${MOSQUITTO_WEB_PORT}:9002"
    volumes:
      - ./volumes/config:/mosquitto/config
      - ./volumes/data:/mosquitto/data
      - ./volumes/log:/mosquitto/log
    secrets:
      - mq_password
    entrypoint: ["/bin/sh", "/mosquitto/config/entrypoint.sh"]

networks:
  shared_net:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_shared_net

secrets:
  mq_password:
    file: ../../secrets/common_password.txt
