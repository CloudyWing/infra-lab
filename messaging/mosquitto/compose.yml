services:
  mosquitto:
    image: eclipse-mosquitto:${MOSQUITTO_TAG}
    container_name: mosquitto
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: ${MOSQUITTO_MEM_LIMIT:-32M}
    memswap_limit: ${MOSQUITTO_MEM_LIMIT:-32M}
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    extends:
      file: ../../policies/base.yml
      service: default-policy
    networks:
      - shared_net
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MOSQUITTO_PORT}:1883"
      - "${BIND_ADDR:-127.0.0.1}:${MOSQUITTO_WEB_PORT}:9002"
    volumes:
      - ./volumes/config:/mosquitto/config
      - ./volumes/data:/mosquitto/data
      - ./volumes/log:/mosquitto/log
    secrets:
      - mq_password
    entrypoint: ["/bin/sh", "/mosquitto/config/entrypoint.sh"]

networks:
  shared_net:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_shared_net

secrets:
  mq_password:
    file: ../../secrets/common_password.txt
