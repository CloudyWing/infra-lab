services:
  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_TAG}
    container_name: keycloak
    extends:
      file: ../../policies/base.yml
      service: default-policy
    networks:
      - shared_net
    ports:
      - "${KEYCLOAK_PORT}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${COMMON_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    command: start-dev
    volumes:
      - ./volumes/data:/opt/keycloak/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000;printf 'GET /health/ready HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q 'HTTP/1.1 200' <&3"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  shared_net:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_shared_net
