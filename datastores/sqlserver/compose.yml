services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:${MSSQL_TAG}
    container_name: sql-server
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: ${SQL_MEM_LIMIT:-2048M}
    memswap_limit: ${SQL_MEM_LIMIT:-2048M}
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    networks:
      - shared_net
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MSSQL_PORT}:1433"
    volumes:
      - ./volumes/data:/var/opt/mssql/data
      - ./volumes/log:/var/opt/mssql/log
      - ./volumes/backup:/var/opt/mssql/backup
    environment:
      - ACCEPT_EULA=Y
      - TZ=${TZ}
      - MSSQL_SA_PASSWORD=${COMMON_PASSWORD}
    healthcheck:
      # 密碼從容器內的環境變數帶入，不寫進 Healthcheck 定義與命令列
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  shared_net:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_shared_net
