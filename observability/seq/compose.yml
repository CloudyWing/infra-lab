services:
  seq:
    image: datalust/seq:${SEQ_TAG}
    container_name: seq
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: ${SEQ_MEM_LIMIT:-768M}
    memswap_limit: ${SEQ_MEM_LIMIT:-768M}
    extends:
      file: ../../policies/base.yml
      service: default-policy
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=${COMMON_PASSWORD}
    volumes:
      - ./volumes/data:/data
    networks:
      - shared_net
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${SEQ_WEB_PORT}:80"
      - "${BIND_ADDR:-127.0.0.1}:${SEQ_INGEST_PORT}:5341"

networks:
  shared_net:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_shared_net
